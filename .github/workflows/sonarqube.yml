name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    types: [opened, synchronize, reopened]

defaults:
  run:
    shell: bash

jobs:
  # Unit Tests - Fast, no external dependencies
  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, apexphere-linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.8.0
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage:unit
        env:
          NODE_ENV: test

      - name: Upload unit test coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 1

  # Integration Tests - Requires Redis and PostgreSQL
  integration-tests:
    name: Integration Tests
    runs-on: [self-hosted, apexphere-linux]

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synckairos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.8.0
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/synckairos?sslmode=disable
          NODE_ENV: test

      - name: Run integration tests with coverage
        run: pnpm test:coverage:integration
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/synckairos?sslmode=disable

      - name: Upload integration test coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/
          retention-days: 1

  # E2E Tests - End-to-end tests with Playwright
  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, apexphere-linux]

    # Match the Playwright version in pnpm-lock.yaml; browsers and OS libraries
    # come from the image instead of a host sudo apt-get install.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      # Give Chromium enough shared memory without exposing the shared host IPC.
      options: --init --ipc=private --shm-size=1g

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synckairos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.8.0
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/synckairos?sslmode=disable
          NODE_ENV: test

      - name: Start SyncKairos server in background
        run: |
          NODE_ENV=development \
          REDIS_HOST=redis \
          REDIS_PORT=6379 \
          REDIS_URL=redis://redis:6379 \
          DATABASE_URL='postgresql://postgres:postgres@postgres:5432/synckairos?sslmode=disable' \
          nohup pnpm tsx src/index.ts > server.log 2>&1 &
          echo $! > server.pid

          # Wait for server to be healthy
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Server is healthy"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

          if ! curl -f http://localhost:3000/health > /dev/null 2>&1; then
            echo "❌ Server failed to start"
            cat server.log
            exit 1
          fi

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          REDIS_HOST: redis
          REDIS_PORT: 6379
          REDIS_URL: redis://redis:6379
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/synckairos?sslmode=disable
          E2E_ENV: local

      - name: Stop server and show logs
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
          echo "=== Server logs ==="
          cat server.log || true

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Restore mounted directory ownership for the runner
        if: always()
        run: |
          chown -R "$(stat -c '%u:%g' "$RUNNER_TEMP")" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE"

  # SonarQube Analysis - Merges coverage from all test stages
  sonarqube:
    name: SonarQube Code Analysis
    runs-on: [self-hosted, apexphere-linux]
    # Install scan utilities as root inside this disposable container, never
    # with sudo on the shared runner host.
    container:
      image: ubuntu:24.04
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Install SonarQube system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq unzip wget xz-utils

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.8.0
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit/

      - name: Download integration test coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration/

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          cp -r coverage-unit/* coverage/ 2>/dev/null || true
          cp -r coverage-integration/* coverage/ 2>/dev/null || true
          echo "✅ Merged coverage reports from unit and integration tests"

      - name: Validate SonarQube configuration
        id: validate_sonar
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ] || [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "⚠️  SonarQube secrets not configured - skipping scan"
            echo "To enable SonarQube analysis:"
            echo "1. Add SONAR_TOKEN secret to repository"
            echo "2. Add SONAR_HOST_URL secret (must include https://)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ SonarQube configuration found"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan
        if: steps.validate_sonar.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        if: steps.validate_sonar.outputs.skip != 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Restore mounted directory ownership for the runner
        if: always()
        run: |
          chown -R "$(stat -c '%u:%g' "$RUNNER_TEMP")" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE"
